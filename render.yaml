services:
  - type: web
    name: jt-sem-mov-retidos
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JT_TIMEZONE
        value: America/Belem
      - key: JT_API_URL
        value: https://jt-api.rockettechbr.com.br
      - key: JT_API_KEY
        sync: false
      - key: JT_API_CACHE_SECONDS
        value: '120'
      - key: JT_PROXY_SEM_MOV_28
        value: '1'
      - key: JT_HISTORY_DAYS
        value: '45'
      - key: JT_API_TIMEOUT
        value: '120'
